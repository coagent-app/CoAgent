[package]
name = "coagent-desktop"
version = "0.0.1"
description = "Co-Agent Desktop"
authors = []
license = ""
repository = ""
default-run = "coagent-desktop"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
