name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            label: Apple Silicon
          - arch: x86_64
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            label: Intel
    name: Build — macOS (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust-target }}

      # macOS: Import signing certificate
      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p actions build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
            rm certificate.p12
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      # Compile sidecar binaries
      - name: Compile coagent-server sidecar
        run: bun build packages/agent-core/dist/server.js --compile --target=${{ matrix.bun-target }} --outfile apps/desktop/src-tauri/binaries/coagent-server-${{ matrix.rust-target }}

      - name: Compile coagent-memory sidecar
        run: bun build packages/mcp-memory/dist/index.js --compile --target=${{ matrix.bun-target }} --outfile apps/desktop/src-tauri/binaries/coagent-memory-${{ matrix.rust-target }}

      - name: chmod sidecars
        run: chmod +x apps/desktop/src-tauri/binaries/*

      # Pre-sign sidecars with hardened runtime before Tauri bundles them
      - name: Sign sidecars
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ENTITLEMENTS="apps/desktop/src-tauri/Entitlements.plist"
          for bin in apps/desktop/src-tauri/binaries/coagent-*-${{ matrix.rust-target }}; do
            echo "Signing $bin"
            codesign --force --options runtime --entitlements "$ENTITLEMENTS" \
              --sign "$APPLE_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict "$bin"
          done

      # Build Tauri app (signs main bundle + notarizes)
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Co-Agent ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

  rename-assets:
    needs: build
    runs-on: ubuntu-latest
    name: Rename release assets
    steps:
      - name: Rename DMGs for clarity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          VERSION="${TAG#v}"

          sleep 5

          echo "Current assets:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name'

          # Rename aarch64 DMG
          AARCH64_DMG=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep "aarch64.*\.dmg$" | head -1)
          if [ -n "$AARCH64_DMG" ]; then
            echo "Renaming $AARCH64_DMG → Co-Agent_${VERSION}_Apple-Silicon.dmg"
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$AARCH64_DMG" --dir /tmp
            mv "/tmp/$AARCH64_DMG" "/tmp/Co-Agent_${VERSION}_Apple-Silicon.dmg"
            gh release delete-asset "$TAG" --repo "${{ github.repository }}" "$AARCH64_DMG" --yes
            gh release upload "$TAG" --repo "${{ github.repository }}" "/tmp/Co-Agent_${VERSION}_Apple-Silicon.dmg"
          fi

          # Rename x86_64 DMG
          X86_DMG=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep "x64.*\.dmg$\|x86_64.*\.dmg$" | head -1)
          if [ -n "$X86_DMG" ]; then
            echo "Renaming $X86_DMG → Co-Agent_${VERSION}_Intel.dmg"
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$X86_DMG" --dir /tmp
            mv "/tmp/$X86_DMG" "/tmp/Co-Agent_${VERSION}_Intel.dmg"
            gh release delete-asset "$TAG" --repo "${{ github.repository }}" "$X86_DMG" --yes
            gh release upload "$TAG" --repo "${{ github.repository }}" "/tmp/Co-Agent_${VERSION}_Intel.dmg"
          fi

          echo "Final assets:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name'
