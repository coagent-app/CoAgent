name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: aarch64
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            label: Apple Silicon
          - arch: x86_64
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            label: Intel
    name: Build — macOS (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Download standalone Node.js binary to bundle with the app.
      # This lets custom integrations run even when users don't have Node installed.
      - name: Download bundled Node.js
        run: |
          NODE_VERSION="v22.12.0"
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin) NODE_ARCH="darwin-arm64" ;;
            x86_64-apple-darwin)  NODE_ARCH="darwin-x64"  ;;
          esac
          echo "Downloading node ${NODE_VERSION} for ${NODE_ARCH}"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${NODE_ARCH}.tar.gz" -o /tmp/node.tar.gz
          rm -rf /tmp/node-extract
          mkdir -p /tmp/node-extract
          tar -xzf /tmp/node.tar.gz -C /tmp/node-extract --strip-components=1
          mkdir -p apps/desktop/src-tauri/binaries
          cp /tmp/node-extract/bin/node "apps/desktop/src-tauri/binaries/node-${{ matrix.rust-target }}"
          chmod +x "apps/desktop/src-tauri/binaries/node-${{ matrix.rust-target }}"
          ls -la "apps/desktop/src-tauri/binaries/node-${{ matrix.rust-target }}"

      # Pre-install @modelcontextprotocol/sdk so custom integrations don't need
      # to run `npm install` at runtime on the user's machine.
      - name: Vendor MCP SDK
        run: |
          mkdir -p apps/desktop/src-tauri/vendor
          cd apps/desktop/src-tauri/vendor
          cat > package.json <<'EOF'
          {
            "name": "coagent-vendor",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "@modelcontextprotocol/sdk": "^1.0.0"
            }
          }
          EOF
          npm install --production --ignore-scripts
          ls node_modules/@modelcontextprotocol/sdk/package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust-target }}

      - name: Compile whisper sidecar
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          case "${{ matrix.rust-target }}" in
            aarch64-apple-darwin)
              cmake -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DWHISPER_METAL=ON -DCMAKE_BUILD_TYPE=Release
              ;;
            x86_64-apple-darwin)
              cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DCMAKE_BUILD_TYPE=Release
              ;;
          esac
          cmake --build build --target whisper-cli -j$(sysctl -n hw.logicalcpu)
          cp build/bin/whisper-cli $GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/whisper-${{ matrix.rust-target }}
          chmod +x $GITHUB_WORKSPACE/apps/desktop/src-tauri/binaries/whisper-${{ matrix.rust-target }}

      # macOS: Import signing certificate
      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p actions build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p actions build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
            rm certificate.p12
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      # Compile sidecar binaries
      - name: Compile coagent-server sidecar
        run: bun build packages/agent-core/dist/server.js --compile --target=${{ matrix.bun-target }} --outfile apps/desktop/src-tauri/binaries/coagent-server-${{ matrix.rust-target }}

      - name: Compile coagent-memory sidecar
        run: bun build packages/mcp-memory/dist/index.js --compile --target=${{ matrix.bun-target }} --outfile apps/desktop/src-tauri/binaries/coagent-memory-${{ matrix.rust-target }}

      - name: chmod sidecars
        run: chmod +x apps/desktop/src-tauri/binaries/*

      # Pre-sign sidecars with hardened runtime before Tauri bundles them
      - name: Sign sidecars
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ENTITLEMENTS="apps/desktop/src-tauri/SidecarEntitlements.plist"
          for bin in \
            apps/desktop/src-tauri/binaries/coagent-server-${{ matrix.rust-target }} \
            apps/desktop/src-tauri/binaries/coagent-memory-${{ matrix.rust-target }} \
            apps/desktop/src-tauri/binaries/node-${{ matrix.rust-target }} \
            apps/desktop/src-tauri/binaries/whisper-${{ matrix.rust-target }}; do
            if [ ! -f "$bin" ]; then continue; fi
            echo "Signing $bin"
            # Strip any embedded ad-hoc signature (Bun --compile adds one)
            codesign --remove-signature "$bin" 2>/dev/null || true
            codesign --force --options runtime --entitlements "$ENTITLEMENTS" \
              --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          done

      # Build Tauri app — sign only, do NOT notarize here.
      # We re-sign sidecars after Tauri builds the bundle, which would
      # invalidate any notarization ticket Tauri staples. Instead we
      # notarize the final .app and DMG ourselves in later steps.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Co-Agent ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

      # Re-sign sidecars inside the .app bundle with permissive entitlements.
      # Tauri's bundler signs everything with the main Entitlements.plist, but
      # sidecars need disable-library-validation to dlopen native modules (LanceDB).
      - name: Re-sign sidecars in bundle
        if: env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "No .app found"; exit 1; fi
          ENTITLEMENTS="apps/desktop/src-tauri/SidecarEntitlements.plist"
          echo "Re-signing sidecars in $APP with $ENTITLEMENTS"
          for bin in \
            "$APP/Contents/MacOS/coagent-server" \
            "$APP/Contents/MacOS/coagent-memory" \
            "$APP/Contents/MacOS/node" \
            "$APP/Contents/MacOS/whisper"; do
            if [ ! -f "$bin" ]; then continue; fi
            echo "  Re-signing $bin"
            codesign --force --options runtime --entitlements "$ENTITLEMENTS" \
              --sign "$APPLE_SIGNING_IDENTITY" "$bin"
          done
          # Re-seal the .app bundle after modifying nested binaries
          echo "Re-sealing $APP"
          codesign --force --options runtime --entitlements "apps/desktop/src-tauri/Entitlements.plist" \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          echo "Verifying signatures..."
          codesign --verify --deep --strict "$APP"
          echo "Done"

      # Notarize the re-signed .app so it has a valid ticket when
      # the user copies it out of the DMG to /Applications.
      - name: Notarize .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "No .app found"; exit 1; fi

          # Zip the .app for notarization submission
          echo "Zipping $APP for notarization..."
          ditto -c -k --keepParent "$APP" /tmp/Co-Agent-notarize.zip

          echo "Submitting .app for notarization..."
          xcrun notarytool submit /tmp/Co-Agent-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 10m

          echo "Stapling .app..."
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          echo ".app notarized and stapled"
          rm /tmp/Co-Agent-notarize.zip

      # Rebuild the DMG with the notarized .app and sign it
      - name: Rebuild and sign DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle -name "*.app" -type d 2>/dev/null | head -1)
          DMG=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ -z "$DMG" ]; then echo "No .app or .dmg found"; exit 1; fi
          echo "Rebuilding $DMG with notarized app"
          rm -f "$DMG"
          hdiutil create -volname "Co-Agent" -srcfolder "$APP" -ov -format UDZO "$DMG"
          # Sign the DMG itself — macOS Sequoia rejects unsigned disk images
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
            echo "DMG signed"
          fi
          echo "DMG rebuilt: $(ls -lh "$DMG")"

      # Notarize the DMG, staple it, rename it, and upload — all on macOS
      - name: Notarize, staple, and rename DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          DMG=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "No DMG found"; exit 1; fi

          # Notarize
          echo "Submitting $DMG for notarization..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 10m

          # Staple
          echo "Stapling ticket..."
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # Rename to friendly name
          FRIENDLY="Co-Agent_${VERSION}_${{ matrix.label == 'Apple Silicon' && 'Apple-Silicon' || 'Intel' }}.dmg"
          FRIENDLY_PATH="$(dirname "$DMG")/$FRIENDLY"
          mv "$DMG" "$FRIENDLY_PATH"

          # Delete the original Tauri-uploaded DMG and upload the final one
          ORIG_NAME=$(basename "$DMG")
          gh release delete-asset "$TAG" "$ORIG_NAME" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release upload "$TAG" "$FRIENDLY_PATH" --repo "${{ github.repository }}"
          echo "Uploaded $FRIENDLY"
