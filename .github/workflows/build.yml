name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: aarch64
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
            node-arch: darwin-arm64
            cmake-arch: arm64
            whisper-flags: -DWHISPER_METAL=ON
            label: Apple Silicon
          - arch: x86_64
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            node-arch: darwin-x64
            cmake-arch: x86_64
            whisper-flags: -DGGML_NATIVE=OFF -DGGML_METAL=OFF
            label: Intel
    name: Build — macOS (${{ matrix.label }})

    env:
      BINARIES: apps/desktop/src-tauri/binaries
      ENTITLEMENTS: apps/desktop/src-tauri/Entitlements.plist
      SIDECAR_ENTITLEMENTS: apps/desktop/src-tauri/SidecarEntitlements.plist
      NODE_VERSION: v22.12.0

    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ──────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust-target }}

      # ── Signing certificate ────────────────────────────────────
      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          rm /tmp/cert.p12

      # ── Sidecar: bundled Node.js ───────────────────────────────
      - name: Download bundled Node.js
        run: |
          mkdir -p "$BINARIES"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${{ matrix.node-arch }}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp
          cp /tmp/bin/node "$BINARIES/node-${{ matrix.rust-target }}"

      # ── Sidecar: whisper (static build) ────────────────────────
      - name: Compile whisper sidecar
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake-arch }} \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.whisper-flags }}
          cmake --build /tmp/whisper.cpp/build --target whisper-cli -j$(sysctl -n hw.logicalcpu)

          BIN="$BINARIES/whisper-${{ matrix.rust-target }}"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "$BIN"

          # Strip dangling build-time rpaths (Gatekeeper rejects these)
          otool -l "$BIN" | awk '/LC_RPATH/{getline;print $2}' | grep '^/tmp' | while read rp; do
            echo "Stripping rpath: $rp"
            install_name_tool -delete_rpath "$rp" "$BIN"
          done

      # ── Vendor MCP SDK ─────────────────────────────────────────
      - name: Vendor MCP SDK
        run: |
          mkdir -p apps/desktop/src-tauri/vendor
          cd apps/desktop/src-tauri/vendor
          cat > package.json <<'PKG'
          { "name": "coagent-vendor", "private": true,
            "dependencies": { "@modelcontextprotocol/sdk": "^1.0.0" } }
          PKG
          npm install --production --ignore-scripts

      # ── Build frontend & TypeScript packages ───────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      # ── Sidecar: Bun-compiled binaries ─────────────────────────
      - name: Compile Bun sidecars
        run: |
          bun build packages/agent-core/dist/server.js \
            --compile --target=${{ matrix.bun-target }} \
            --outfile "$BINARIES/coagent-server-${{ matrix.rust-target }}"
          bun build packages/mcp-memory/dist/index.js \
            --compile --target=${{ matrix.bun-target }} \
            --outfile "$BINARIES/coagent-memory-${{ matrix.rust-target }}"

      # ── Sign all sidecars ──────────────────────────────────────
      - name: Sign sidecars
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bin in "$BINARIES"/*-${{ matrix.rust-target }}; do
            [ -f "$bin" ] || continue
            echo "Signing $(basename "$bin")"
            codesign --remove-signature "$bin" 2>/dev/null || true
            codesign --force --options runtime \
              --entitlements "$SIDECAR_ENTITLEMENTS" \
              --sign "$APPLE_SIGNING_IDENTITY" "$bin"
            codesign --verify --strict "$bin"
          done

      # ── Verify all sidecars before Tauri build ─────────────────
      - name: Verify sidecars
        run: |
          echo "--- Checking for dangling load commands ---"
          FAIL=0
          for bin in "$BINARIES"/*-${{ matrix.rust-target }}; do
            [ -f "$bin" ] || continue
            DANGLING=$(otool -l "$bin" | awk '/LC_RPATH/{getline;print $2}' | grep -v '^@' | grep -v '^/usr' | grep -v '^/System' || true)
            if [ -n "$DANGLING" ]; then
              echo "DANGLING RPATHS in $(basename "$bin"):"
              echo "$DANGLING"
              FAIL=1
            fi
            DANGLING_DYLIB=$(otool -L "$bin" | tail -n+2 | awk '{print $1}' | grep -v '^@' | grep -v '^/usr/lib' | grep -v '^/System' || true)
            if [ -n "$DANGLING_DYLIB" ]; then
              echo "EXTERNAL DYLIBS in $(basename "$bin"):"
              echo "$DANGLING_DYLIB"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Dangling load commands detected — Gatekeeper will block this build"
            exit 1
          fi
          echo "All sidecars clean"

      # ── Tauri build (sign + notarize .app) ─────────────────────
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Co-Agent ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }}

      # ── Notarize DMG + rename with arch label ──────────────────
      - name: Notarize & rename DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          VERSION="${TAG#v}"
          case "${{ matrix.arch }}" in
            aarch64) FRIENDLY="Apple-Silicon" ;;
            x86_64)  FRIENDLY="Intel" ;;
          esac

          DMG=$(find apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg \
                -name "*.dmg" 2>/dev/null | head -1)
          [ -z "$DMG" ] && { echo "No DMG found"; exit 0; }
          echo "Found DMG: $DMG"

          # Notarize + staple DMG (Tauri only notarizes the .app inside)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 600
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          # Upload renamed DMG to release
          FINAL="Co-Agent_${VERSION}_${FRIENDLY}.dmg"
          cp "$DMG" "/tmp/${FINAL}"
          ORIGINAL=$(basename "$DMG")
          gh release delete-asset "$TAG" --repo "${{ github.repository }}" "$ORIGINAL" --yes 2>/dev/null || true
          gh release upload "$TAG" --repo "${{ github.repository }}" "/tmp/${FINAL}"

  # ─────────────────────────────────────────────────────────────
  # Windows build — unsigned artifacts only for now.
  # `continue-on-error: true` so a Windows regression never blocks the macOS release.
  # Signing (Authenticode) will be added once a cert is procured.
  # ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    name: Build — Windows (x86_64, unsigned)

    defaults:
      run:
        shell: bash

    env:
      BINARIES: apps/desktop/src-tauri/binaries
      NODE_VERSION: v22.12.0
      RUST_TARGET: x86_64-pc-windows-msvc
      BUN_TARGET: bun-windows-x64

    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ──────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: x86_64-pc-windows-msvc

      # ── Sidecar: bundled Node.js ───────────────────────────────
      - name: Download bundled Node.js
        run: |
          mkdir -p "$BINARIES"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-win-x64.zip" -o /tmp/node.zip
          unzip -q /tmp/node.zip -d /tmp
          cp "/tmp/node-${NODE_VERSION}-win-x64/node.exe" "${BINARIES}/node-${RUST_TARGET}.exe"

      # ── Sidecar: whisper (static build) ────────────────────────
      - name: Compile whisper sidecar
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli -j 2
          cp /tmp/whisper.cpp/build/bin/Release/whisper-cli.exe "${BINARIES}/whisper-${RUST_TARGET}.exe"

      # ── Vendor MCP SDK ─────────────────────────────────────────
      - name: Vendor MCP SDK
        run: |
          mkdir -p apps/desktop/src-tauri/vendor
          cd apps/desktop/src-tauri/vendor
          cat > package.json <<'PKG'
          { "name": "coagent-vendor", "private": true,
            "dependencies": { "@modelcontextprotocol/sdk": "^1.0.0" } }
          PKG
          npm install --production --ignore-scripts

      # ── Build frontend & TypeScript packages ───────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      # ── Sidecar: Bun-compiled binaries ─────────────────────────
      - name: Compile Bun sidecars
        run: |
          bun build packages/agent-core/dist/server.js \
            --compile --target=${BUN_TARGET} \
            --outfile "${BINARIES}/coagent-server-${RUST_TARGET}.exe"
          bun build packages/mcp-memory/dist/index.js \
            --compile --target=${BUN_TARGET} \
            --outfile "${BINARIES}/coagent-memory-${RUST_TARGET}.exe"

      # ── Tauri build (NSIS installer, unsigned) ─────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Co-Agent ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download for your platform.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # ── Upload renamed NSIS installer ──────────────────────────
      - name: Rename & upload Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          VERSION="${TAG#v}"
          NSIS=$(find apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -name "*.exe" 2>/dev/null | head -1)
          if [ -z "$NSIS" ]; then
            echo "No NSIS installer found"
            exit 0
          fi
          echo "Found installer: $NSIS"
          FINAL="Co-Agent_${VERSION}_Windows-x64-unsigned.exe"
          cp "$NSIS" "/tmp/${FINAL}"
          ORIGINAL=$(basename "$NSIS")
          gh release delete-asset "$TAG" --repo "${{ github.repository }}" "$ORIGINAL" --yes 2>/dev/null || true
          gh release upload "$TAG" --repo "${{ github.repository }}" "/tmp/${FINAL}"

      # ── Always upload build artifacts for inspection ───────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7
